[package]
name = "adaptive-web-engine-fabric"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Altru Browser native adaptive web-engine foundation"
authors = ["Valentyn Rukhaylo / Altru.dev"]
repository = "https://github.com/altrudev/Altru-Browser"
homepage = "https://altru.dev"
readme = "README.md"
publish = false

[features]
default = []
servo-engine = ["dep:servo", "dep:dpi", "dep:url", "servo/bundled"]
servo-jit = ["servo-engine", "servo/js_jit"]
taffy-layout = ["dep:taffy"]
desktop-preview = ["taffy-layout", "dep:eframe", "dep:ureq", "dep:image", "dep:url"]

[dependencies]
hex = "0.4"
ab_glyph = "0.2.32"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dpi = { version = "0.1.2", optional = true }
url = { version = "2.5.8", optional = true }
servo = { version = "=0.6.0", optional = true, default-features = false }
taffy = { version = "=0.14.0", optional = true, default-features = false, features = ["std", "block_layout", "flexbox", "grid", "taffy_tree"] }
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
ureq = { version = "=2.12.1", optional = true }
image = { version = "=0.25.8", optional = true, default-features = false, features = ["png"] }

[[bin]]
name = "altru-browser"
path = "src/bin/altru_browser.rs"
required-features = ["desktop-preview"]
