name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Altru Browser. Please separate observed behavior from expectations."
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: "commit SHA or release"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Linux, Windows, macOS, Android, iOS"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Do not include secrets or private data.
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: "This is not an exploitable security vulnerability. I will follow SECURITY.md for sensitive security reports."
          required: true
